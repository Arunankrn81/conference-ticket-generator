<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conference Ticket Generator</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <!-- LEFT PANEL -->

    <section class="form-panel">

      <div class="brand">

        <div class="brand-logo">
          ✦
        </div>

        <h2>
          Coding Conf
        </h2>

      </div>

      <h1>
        Your Journey to Coding Conf 2025 Starts Here!
      </h1>

      <p class="subtitle">
        Secure your spot at next year's biggest coding conference.
      </p>

      <form id="ticketForm">

        <label>
          Upload Avatar
        </label>

        <label for="avatar" class="upload-box">

          <!-- NEW ICON -->

          <div class="upload-icon">

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">

              <path d="M12 16V9" />

              <path d="M8.5 12.5L12 9L15.5 12.5" />

              <path d="M7 17.5H17" />

              <path
                d="M6.5 17.5C4.57 17.5 3 15.93 3 14C3 12.29 4.22 10.84 5.87 10.57C6.56 7.89 8.94 6 11.7 6C14.42 6 16.73 7.84 17.47 10.45C19.29 10.59 21 12.12 21 14C21 15.93 19.43 17.5 17.5 17.5" />

            </svg>

          </div>

          <p id="fileName">
            Drag and drop or click to upload
          </p>

          <small>
            JPG, PNG or GIF (max. 2MB)
          </small>

        </label>

        <input type="file" id="avatar" accept="image/*" hidden />

        <label>
          Full Name
        </label>

        <input type="text" id="fullName" placeholder="Enter your full name" required />

        <label>
          Email Address
        </label>

        <input type="email" id="email" placeholder="example@email.com" required />

        <label>
          GitHub Username
        </label>

        <input type="text" id="github" placeholder="@yourusername" required />

        <button type="submit">
          Generate My Ticket
        </button>

      </form>

    </section>

    <!-- RIGHT PANEL -->

    <section class="preview-panel">

      <h2>
        Your Ticket Preview
      </h2>

      <div class="ticket">

        <div class="ticket-outline"></div>

        <!-- LEFT -->

        <div class="ticket-main">

          <div class="ticket-top">

            <div class="ticket-logo">
              ✦
            </div>

            <div>

              <h3>
                Coding Conf
              </h3>

              <p>
                Jan 31, 2025 / Austin, TX
              </p>

            </div>

          </div>

          <div class="ticket-user">

            <img id="ticketAvatar" src="" alt="" />

            <div>

              <h4 id="ticketName"></h4>

              <p id="ticketGithub"></p>

            </div>

          </div>

        </div>

        <!-- RIGHT -->

        <div class="ticket-number">

          <div class="dash-line"></div>

          <span>
            #01609
          </span>

        </div>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>

</html>
